version: "3.9"

services:
  aria-agent:
    build: .
    container_name: aria-instagram-agent
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/opt/aria-ai-influencer/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
