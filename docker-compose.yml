services:
  aria-agent:
    build: .
    container_name: aria-instagram-agent
    restart: always
    env_file:
      - .env
    environment:
      AGENT_DB_PATH: /opt/aria-ai-influencer/data/instagram_agent_state.db
      AGENT_WEBHOOK_HOST: 0.0.0.0
      AGENT_WEBHOOK_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/opt/aria-ai-influencer/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
